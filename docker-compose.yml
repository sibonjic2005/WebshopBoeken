services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: boekenhandel
      POSTGRES_PASSWORD: boekenhandel
      POSTGRES_DB: boekenhandel
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
